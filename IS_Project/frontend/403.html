<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>403 - Forbidden | SecureVault</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#f8f9ff] font-['Inter'] text-[#0b1c30] min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-[#E8EDF3] p-8 text-center space-y-4">
    <div class="w-16 h-16 rounded-full bg-red-100 text-red-700 flex items-center justify-center mx-auto">
      <span class="material-symbols-outlined text-3xl">gpp_bad</span>
    </div>
    <h1 class="text-2xl font-bold text-[#01345d]">403 - Access Forbidden</h1>
    <p class="text-sm text-[#42474e]">
      {{ reason or "You do not have the necessary administrative privileges or permissions to access this enclave
      resource." }}
    </p>
    <div class="pt-4 flex gap-3 justify-center">
      <a href="{{ url_for('main.dashboard') }}"
        class="px-4 py-2 rounded-lg bg-[#01345d] text-white text-xs font-semibold hover:bg-[#234b75] transition-colors">
        Return to Dashboard
      </a>
      <a href="{{ url_for('auth.login') }}"
        class="px-4 py-2 rounded-lg bg-[#eff4ff] text-[#01345d] text-xs font-semibold hover:bg-[#dce9ff] transition-colors">
        Switch Account
      </a>
    </div>
  </div>
</body>

</html>
