<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01345d"/>
      <stop offset="100%" stop-color="#145fab"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d5e3ff"/>
    </linearGradient>
  </defs>
  <!-- Outer Shield -->
  <path d="M60 12 L100 28 C100 70, 60 102, 60 108 C60 102, 20 70, 20 28 Z" fill="url(#shieldGrad)"/>
  <!-- Inner Shield Trim -->
  <path d="M60 20 L92 34 C92 68, 60 94, 60 98 C60 94, 28 68, 28 34 Z" fill="none" stroke="#73adff" stroke-width="2.5" opacity="0.6"/>
  <!-- Vault Padlock / Key Enclave -->
  <rect x="45" y="54" width="30" height="24" rx="5" fill="url(#keyGrad)" />
  <path d="M50 54 V44 C50 38.5 54.5 34 60 34 C65.5 34 70 38.5 70 44 V54" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Keyhole -->
  <circle cx="60" cy="63" r="3" fill="#01345d"/>
  <polygon points="58.5,63 61.5,63 62.5,72 57.5,72" fill="#01345d"/>
</svg>
